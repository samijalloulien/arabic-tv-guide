image: node:20

stages:
  - update_epg

generate_epg_api:
  stage: update_epg
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - npm install
  script:
    - node filter_top_channels.js
    - npm run grab --- --channels=fast_channels.xml --days=7 --maxConnections=2 --delay=500 --output=guides/fast.xml
    - npm run grab --- --channels=slow_channels.xml --days=7 --maxConnections=1 --delay=1500 --output=guides/slow.xml
    - node convert.js
    - |
      git config user.name "EPG Bot"
      git config user.email "epg-bot@gitlab.com"
      git checkout -B "$CI_COMMIT_REF_NAME"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      git add api/ metadata_cache.json
      if ! git diff --cached --quiet; then
        git commit -m "Update 7-day EPG & TMDB metadata"
        git push -o ci.skip origin "$CI_COMMIT_REF_NAME"
      else
        echo "No schedule changes to commit."
      fi